version: "3"
services:
    filebrowser:
        stdin_open: true
        tty: true
        privileged: true
        container_name: filebrowser
        restart: always
        networks:
            mynet:
                ipv6_address: f602:fa3f:0:0::16
                ipv4_address: 192.168.0.16
        ports:
            - "127.0.0.1:38082:80"
        volumes:
            - /opt/dockerservice/filebrowser/srv:/srv
            - /opt/dockerservice/filebrowser/config/config.json:/etc/config.json
            - /opt/dockerservice/filebrowser/db/database.db:/etc/database.db
        image: filebrowser/filebrowser
networks:
    mynet:
        external: true
        name: mynet
