version: "3"

services:
  filebrowser:
    stdin_open: true
    tty: true
    privileged: true
    container_name: bark
    restart: always
    networks:
      mynet:
        ipv6_address: f602:fa3f:0:0::44
        ipv4_address: 192.168.0.44
    ports:
      - "127.0.0.1:38080:8080"
    volumes:
      - /opt/dockerservice/bark/data:/data
    image: finab/bark-server

networks:
  mynet:
    external: true
    name: mynet
